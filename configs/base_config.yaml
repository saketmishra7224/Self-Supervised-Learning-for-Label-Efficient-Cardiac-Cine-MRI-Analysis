# =============================================================================
# Motion-Guided SSL for Cardiac Cine MRI — Base Configuration
# =============================================================================

project:
  name: "motion_guided_ssl_cardiac"
  seed: 42
  seeds: [42, 123, 456]  # For multi-seed experiments
  device: "auto"  # auto-detects GPU/CPU
  mixed_precision: true
  num_workers: 4

data:
  raw_dir: "data/raw/ACDC"
  processed_dir: "data/processed"
  splits_dir: "data/splits"
  input_size: [256, 256]
  num_classes: 4  # 0=BG, 1=LV, 2=Myo, 3=RV
  # ACDC original: 0=BG, 1=RV, 2=Myo, 3=LV → remap to spec
  label_remap: {0: 0, 1: 3, 2: 2, 3: 1}  # ACDC→spec mapping
  pixel_spacing: [1.5, 1.5]  # Target in-plane resolution (mm)
  normalize: "zscore"  # per-volume z-score
  
splits:
  train_ratio: 0.70
  val_ratio: 0.10
  test_ratio: 0.20
  stratify_by: "pathology"
  label_fractions: [0.10, 0.25, 0.50, 1.00]

baseline:
  model: "unet"
  encoder_channels: [32, 64, 128, 256]
  dropout: 0.1
  batch_size: 8
  epochs: 200
  early_stopping_patience: 30
  optimizer: "adamw"
  lr: 1.0e-4
  weight_decay: 1.0e-5
  scheduler: "cosine"
  warmup_epochs: 5
  loss: "dice_ce"

ssl:
  epochs: 100
  batch_size: 16
  lr: 1.0e-4
  weight_decay: 1.0e-5
  mask_ratio: 0.5
  mask_patch_size: 16
  reconstruction_weight: 1.0
  temporal_weight: 0.1  # λ_temporal
  temperature: 0.1  # For temporal consistency
  
motion:
  flow_channels: [16, 32, 64, 32]
  smoothness_weight: 0.01
  motion_weight: 0.1  # λ_motion
  
pseudo_labels:
  confidence_threshold: 0.9
  threshold_sweep: [0.7, 0.8, 0.85, 0.9, 0.95]
  pseudo_weight: 0.25  # λ_pseudo
  num_augmentations: 5  # For augmentation agreement
  update_interval: 10  # Re-generate pseudo-labels every N epochs
  
finetuning:
  epochs: 200
  batch_size: 8
  encoder_lr: 1.0e-5  # Lower LR for pretrained encoder
  decoder_lr: 1.0e-4
  weight_decay: 1.0e-5
  early_stopping_patience: 30
